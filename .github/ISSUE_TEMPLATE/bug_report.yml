name: Bug report
description: Something in rastack misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code or steps that trigger the problem.
      render: rust
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rastack version / commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: linux x86_64, rustc 1.97.1
